<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Markdown autoformat</title>
    <script type="text/javascript" src="../v1/plugins.js"></script>
    <script type="text/javascript">
        // The relative ../v1/ path only exists for plugins installed on the
        // Document Server itself. When loaded from another origin (developer
        // mode), fall back synchronously so later scripts see window.Asc.
        if (!(window.Asc && window.Asc.plugin)) {
            document.write('<script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js">\x3C/script>');
        }
    </script>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            font-size: 12px;
            color: #333;
            margin: 0;
            padding: 12px;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .row label { cursor: pointer; user-select: none; }
        button {
            font-size: 12px;
            padding: 5px 10px;
            cursor: pointer;
        }
        #status {
            min-height: 16px;
            color: #666;
            margin-bottom: 8px;
        }
        #status.off { color: #b04a00; }
        .hint {
            color: #888;
            line-height: 1.5;
            border-top: 1px solid #ddd;
            padding-top: 8px;
        }
        .hint code {
            background: #f2f2f2;
            padding: 0 3px;
            border-radius: 3px;
        }
        #about-view h1 {
            font-size: 14px;
            margin: 0 0 2px 0;
        }
        #about-view .version {
            color: #888;
            margin-bottom: 10px;
        }
        #about-view .desc {
            line-height: 1.5;
            margin-bottom: 12px;
        }
        #about-view .author {
            margin-bottom: 2px;
        }
        #about-view .company {
            color: #888;
            margin-bottom: 12px;
        }
        #about-view .back {
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="main-view">
        <div class="row">
            <input type="checkbox" id="enabled" checked />
            <label for="enabled" id="enabled-label">Autoformat is on</label>
        </div>
        <div id="status"></div>
        <div class="row">
            <button id="convert-doc">Convert whole document</button>
            <button id="about-btn">About</button>
        </div>
        <div class="hint">
            Type markdown, get formatting: <code># </code> headings,
            <code>**bold**</code>, <code>*italic*</code>, <code>__bold__</code>,
            <code>_italic_</code>, <code>~~strike~~</code>,
            <code>`code`</code>, <code>```</code> code block,
            <code>[text](https://url)</code> link.<br />
            Ctrl+Z undoes a conversion.
            <span id="plugin-version" style="display:block;color:#aaa;"></span>
        </div>
    </div>
    <div id="about-view" style="display: none;">
        <h1 id="about-title"></h1>
        <div class="version" id="about-version"></div>
        <div class="desc" id="about-desc"></div>
        <div class="author" id="about-author"></div>
        <div class="company" id="about-company"></div>
        <button class="back" id="about-back">← Back</button>
    </div>

    <script type="text/javascript" src="scripts/rules.js?v=15"></script>
    <script type="text/javascript" src="scripts/engine.js?v=15"></script>
    <script type="text/javascript" src="scripts/ui.js?v=15"></script>
</body>
</html>
